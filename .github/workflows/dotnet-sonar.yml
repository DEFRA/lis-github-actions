name: 'Test and Sonar'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: 'Git ref to check out before analysis'
        required: true
        type: string
      branch:
        description: 'Branch name for branch analysis; omit for pull request analysis'
        required: false
        type: string
        default: ''
      sonar-exclusions:
        description: 'Comma-separated sonar.exclusions patterns'
        required: false
        type: string
        default: '.github/**,tests/Endpoints/**'
    secrets:
      LIS_SONAR_TOKEN:
        required: true
    outputs:
      quality-gate-status:
        description: 'SonarCloud quality gate result (PASSED, WARN or FAILED)'
        value: ${{ jobs.sonar-cloud.outputs.quality-gate-status }}

permissions:
  contents: read

jobs:
  sonar-cloud:
    name: 'SonarCloud Analysis'
    runs-on: ubuntu-latest
    outputs:
      quality-gate-status: ${{ steps.quality_gate.outputs.quality-gate-status }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ./.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Build, test and analyse
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.LIS_SONAR_TOKEN }}
          PROJECT_KEY: DEFRA_${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          EXCLUSIONS: ${{ inputs.sonar-exclusions }}
        run: |
          branch_args=()
          if [[ -n "$BRANCH" ]]; then
            branch_args+=("/d:sonar.branch.name=$BRANCH")
          fi

          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$PROJECT_KEY" \
            /o:"defra" \
            /v:"$PROJECT_VERSION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="$EXCLUSIONS" \
            "${branch_args[@]}"

          dotnet build --no-incremental

          dotnet test \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage

          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: SonarCloud Quality Gate check
        id: quality_gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b #v1.20
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.LIS_SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
