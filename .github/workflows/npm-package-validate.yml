name: 'Validate'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: 'Git ref or commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: 'Audit, Format, Lint, Build and Test'
    runs-on: ubuntu-latest
    # Cake runs npm with --cache ./.cake/npm-cache (base.cake), so point npm's
    # own cache there too: setup-node caches `npm config get cache`, and would
    # otherwise save and restore an empty ~/.npm.
    env:
      npm_config_cache: ${{ github.workspace }}/.cake/npm-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate
        uses: cake-build/cake-action@deebeed9c3cf71ad80a9dbdd0ac517392b8847ee # master after v3.0.1: runs on node24 (unreleased)
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        with:
          cake-version: 6.3.0
          script-path: ./build.cake
          target: Build
