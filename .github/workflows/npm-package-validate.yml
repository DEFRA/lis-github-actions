name: 'Validate'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: 'Git ref or commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: 'Audit, Format, Lint, Build and Test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate
        uses: cake-build/cake-action@763b621ef69b317c1d6bde43a65f189c936b503b # master after v3.0.1: runs on node24 (unreleased)
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        with:
          cake-version: 6.3.0
          script-path: ./build.cake
          target: Build
