name: 'Publish NuGet'
description: >-
  Publishes the NuGet packages that a successful prerelease or release run built for the tagged commit to
  NuGet.org with trusted publishing. Checks out the version tag, replacing the workspace's checkout.

inputs:
  version:
    description: 'Version tag identifying the package artifact to publish'
    required: true
  nuget-username:
    description: 'NuGet.org user (profile name) that owns the trusted publishing policy'
    required: true
  github-token:
    description: 'Token used to find and download the package artifact; needs actions: read'
    required: false
    default: ${{ github.token }}

outputs:
  build-run-id:
    description: 'ID of the workflow run that built the published packages'
    value: ${{ steps.find-artifact.outputs.run-id }}

runs:
  using: composite
  steps:
    - name: Checkout version tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ inputs.version }}
        persist-credentials: false

    - name: Find package build artifact
      id: find-artifact
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARTIFACT_NAME: nuget-packages-${{ inputs.version }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../_common/find-artifact.py"

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.0.1
      with:
        dotnet-version: latest
        dotnet-quality: ga
        check-latest: true

    - name: Download NuGet packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.find-artifact.outputs.artifact-id }}
        run-id: ${{ steps.find-artifact.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: artifacts
        merge-multiple: true

    # Composite steps cannot set timeout-minutes, so bound the wait with timeout(1) instead.
    - name: Verify package provenance and completed validation
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PACKAGE_VERSION: ${{ inputs.version }}
        BUILD_RUN_ID: ${{ steps.find-artifact.outputs.run-id }}
      shell: bash
      run: timeout 12m python3 "$GITHUB_ACTION_PATH/../_common/verify-provenance.py"

    - name: NuGet trusted publishing login
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nuget-username }}

    - name: Push to NuGet.org
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      shell: bash
      run: |
        dotnet nuget push "artifacts/*.nupkg" \
          --api-key "$NUGET_API_KEY" \
          --source "https://api.nuget.org/v3/index.json" \
          --skip-duplicate
