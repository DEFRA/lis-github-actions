name: 'Test and Sonar'
description: >-
  Builds and tests a .NET solution with coverage under the SonarScanner for .NET, then checks the
  SonarCloud quality gate. Skips the analysis for Dependabot pull request validation.

inputs:
  version:
    description: 'Version reported to SonarCloud'
    required: true
  ref:
    description: >-
      Git ref to check out, with all history and tags, before analysis. Empty to use the repository already
      checked out in the workspace, which needs full history (fetch-depth: 0) for blame information.
    required: false
    default: ''
  branch:
    description: 'Branch name for branch analysis; omit for pull request analysis'
    required: false
    default: ''
  sonar-exclusions:
    description: 'Comma-separated sonar.exclusions patterns'
    required: false
    default: '.github/**,tests/Endpoints/**'
  sonar-token:
    # Optional so Dependabot pull requests, whose secrets store has no LIS_SONAR_TOKEN, can use this
    # action; the Sonar steps are skipped for that actor during PR validation. Merged releases are analysed.
    description: 'SonarCloud token, normally secrets.LIS_SONAR_TOKEN'
    required: false
    default: ''
  github-token:
    description: 'Token the scanner uses to read pull request information'
    required: false
    default: ${{ github.token }}

outputs:
  quality-gate-status:
    description: 'SonarCloud quality gate result (PASSED, WARN or FAILED; empty for Dependabot PR validation)'
    value: ${{ steps.quality_gate.outputs.quality-gate-status }}

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: 17
        distribution: 'zulu'

    - name: Checkout code
      if: ${{ inputs.ref != '' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        fetch-tags: true

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.0.1
      with:
        global-json-file: global.json

    - name: Cache SonarQube Cloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube Cloud scanner
      if: ${{ steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

    - name: Build, test and analyse
      if: ${{ github.actor != 'dependabot[bot]' || github.event.action == 'closed' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }} # Needed to get PR information, if any
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        PROJECT_KEY: DEFRA_${{ github.event.repository.name }}
        PROJECT_VERSION: ${{ inputs.version }}
        BRANCH: ${{ inputs.branch }}
        EXCLUSIONS: ${{ inputs.sonar-exclusions }}
      shell: bash
      run: '"$GITHUB_ACTION_PATH/analyse.sh"'

    - name: SonarCloud Quality Gate check
      id: quality_gate
      if: ${{ github.actor != 'dependabot[bot]' || github.event.action == 'closed' }}
      uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b #v1.20
      with:
        scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        # Composite steps cannot set timeout-minutes; bound the gate's polling instead.
        pollingTimeoutSec: 300
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: https://sonarcloud.io
