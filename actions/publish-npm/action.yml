name: 'Publish npm'
description: >-
  Publishes the npm package that a successful prerelease or release run built for the tagged commit to
  npmjs with trusted publishing. Checks out the version tag, replacing the workspace's checkout.

inputs:
  version:
    description: 'Version tag identifying the package artifact to publish'
    required: true
  dist-tag:
    description: >-
      npm dist-tag to publish under. Empty to use alpha for a prerelease version (one containing "-")
      and latest for a stable one
    required: false
    default: ''
  github-token:
    description: 'Token used to find and download the package artifact; needs actions: read'
    required: false
    default: ${{ github.token }}

outputs:
  build-run-id:
    description: 'ID of the workflow run that built the published package'
    value: ${{ steps.find-artifact.outputs.run-id }}
  dist-tag:
    description: 'npm dist-tag the package was published under'
    value: ${{ steps.dist-tag.outputs.dist-tag }}

runs:
  using: composite
  steps:
    - name: Checkout version tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ inputs.version }}
        persist-credentials: false

    - name: Find package build artifact
      id: find-artifact
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARTIFACT_NAME: npm-packages-${{ inputs.version }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../_common/find-artifact.py"

    # Trusted publishing needs npm 11.5.1 or later, which current Node 24 releases include.
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        package-manager-cache: false

    - name: Download npm package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.find-artifact.outputs.artifact-id }}
        run-id: ${{ steps.find-artifact.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: artifacts
        merge-multiple: true

    # Composite steps cannot set timeout-minutes, so bound the wait with timeout(1) instead.
    - name: Verify package provenance and completed validation
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PACKAGE_VERSION: ${{ inputs.version }}
        BUILD_RUN_ID: ${{ steps.find-artifact.outputs.run-id }}
      shell: bash
      run: timeout 12m python3 "$GITHUB_ACTION_PATH/../_common/verify-provenance.py"

    - name: Verify package version
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.tgz')
        if [[ ${#packages[@]} -ne 1 ]]; then
          echo "Expected exactly one npm package, found ${#packages[@]}." >&2
          exit 1
        fi

        packaged_version=$(tar -xOf "${packages[0]}" package/package.json | jq -r '.version')
        if [[ "$packaged_version" != "$EXPECTED_VERSION" ]]; then
          echo "Package version '$packaged_version' does not match tag '$EXPECTED_VERSION'." >&2
          exit 1
        fi

    - name: Choose dist-tag
      id: dist-tag
      env:
        VERSION: ${{ inputs.version }}
        DIST_TAG: ${{ inputs.dist-tag }}
      shell: bash
      run: |
        if [[ -z "$DIST_TAG" ]]; then
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=alpha
          else
            DIST_TAG=latest
          fi
        fi
        echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

    # npm exchanges the job's OIDC token for a publish token, so the calling job needs id-token: write.
    - name: Publish to npmjs
      env:
        DIST_TAG: ${{ steps.dist-tag.outputs.dist-tag }}
      shell: bash
      run: npm publish ./artifacts/*.tgz --tag "$DIST_TAG"
